name: EgoMQ tests

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        name: run unit tests
        runs-on: ubuntu-latest

        steps: 
            - name: checkout repo
              uses: actions/checkout@v4

            - name: setup bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: latest

            - name: install dependencies
              run: bun install --frozen-lockfile

            - name: run vitest
              run: bun run test